  <circle cx="262" cy="338" r="50" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3" stroke-dasharray="30 200" stroke-linecap="round" transform="rotate(200 262 338)"/>
  <rect x="236" y="318" width="40" height="40" fill="#B8456B" transform="rotate(20 256 338)"/>
  <line x1="308" y1="384" x2="352" y2="440" stroke="#1B1F2A" stroke-width="20" stroke-linecap="round"/>
  <line x1="308" y1="384" x2="326" y2="408" stroke="#C9A24A" stroke-width="20" stroke-linecap="round"/>
  <!-- question marks -->
  <text x="324" y="150" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#F6C9BE">?</text>
  <text x="26" y="64" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#F6C9BE" opacity=".7">?</text>
