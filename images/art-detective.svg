  <rect y="440" width="400" height="60" fill="#A82F1C"/>
  <!-- frame -->
  <rect x="62" y="96" width="244" height="304" fill="#2A211C"/>
  <rect x="74" y="108" width="220" height="280" fill="#C9A24A"/>
  <rect x="82" y="116" width="204" height="264" fill="#F4EFE3"/>
  <!-- scene inside the frame -->
