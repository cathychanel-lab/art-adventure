  <circle cx="226" cy="168" r="26" fill="#F2C14E"/>
  <path d="M82 260 L150 190 L206 250 L246 216 L286 252 V380 H82 Z" fill="#3E5C8A"/>
  <path d="M82 310 Q150 280 210 316 T286 304 V380 H82 Z" fill="#1F7A62"/>
